name: Publish to Crates.io

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          chmod +x scripts/set_version.py
          ./scripts/set_version.py $TAG_VERSION
          
          # Verify changes
          grep "^version" Cargo.toml
          grep "zabi-derive" Cargo.toml

      - name: Publish zabi-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --manifest-path zabi-derive/Cargo.toml
          echo "Waiting for crates.io to index zabi-derive..."
          sleep 60

      - name: Publish zabi-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
